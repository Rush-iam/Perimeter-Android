<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Base Metallic Green Gradient -->
    <radialGradient id="beadGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2fbe2" />
      <stop offset="55%" stop-color="#82d882" />
      <stop offset="85%" stop-color="#32883a" />
      <stop offset="100%" stop-color="#144818" />
    </radialGradient>

    <!-- Large Orb Main Gradient -->
    <radialGradient id="largeOrbGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#f0fdf0" />
      <stop offset="45%" stop-color="#9be49b" />
      <stop offset="75%" stop-color="#3b9643" />
      <stop offset="95%" stop-color="#17501c" />
      <stop offset="100%" stop-color="#0b2c0f" />
    </radialGradient>

    <!-- Connection Link Gradient -->
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4aa850" />
      <stop offset="50%" stop-color="#a3f0a3" />
      <stop offset="100%" stop-color="#2d7833" />
    </linearGradient>

    <!-- Drop Shadow for Orbs -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="1" flood-color="#051a07" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Connecting Spiral Backbone -->
    <path d="M 58 84 
             C 72 75, 88 72, 85 58 
             C 83 44, 88 30, 75 18 
             C 60 5, 38 4, 22 14 
             C 7 24, 6 48, 16 64 
             C 25 78, 48 83, 60 72 
             C 70 62, 68 44, 56 36 
             C 46 28, 32 34, 33 46 
             C 34 54, 45 56, 48 48" 
          fill="none" 
          stroke="url(#linkGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#shadow)"/>

    <!-- Inner Core Glow Spiral -->
    <path d="M 58 84 
             C 72 75, 88 72, 85 58 
             C 83 44, 88 30, 75 18 
             C 60 5, 38 4, 22 14 
             C 7 24, 6 48, 16 64 
             C 25 78, 48 83, 60 72 
             C 70 62, 68 44, 56 36 
             C 46 28, 32 34, 33 46 
             C 34 54, 45 56, 48 48" 
          fill="none" 
          stroke="#eefce0" 
          stroke-width="1.2" 
          stroke-linecap="round" 
          opacity="0.8"/>

    <!-- Small Spiral Beads (Center to Outer Tail) -->
    <!-- Innermost Loop -->
    <circle cx="48" cy="48" r="2.2" fill="url(#beadGrad)" />
    <circle cx="42" cy="51" r="2.3" fill="url(#beadGrad)" />
    <circle cx="36" cy="48" r="2.5" fill="url(#beadGrad)" />
    <circle cx="34" cy="42" r="2.6" fill="url(#beadGrad)" />
    <circle cx="37" cy="36" r="2.7" fill="url(#beadGrad)" />
    <circle cx="44" cy="33" r="2.8" fill="url(#beadGrad)" />
    <circle cx="52" cy="34" r="3.0" fill="url(#beadGrad)" />
    
    <!-- Middle Loop -->
    <circle cx="60" cy="38" r="3.1" fill="url(#beadGrad)" />
    <circle cx="64" cy="46" r="3.3" fill="url(#beadGrad)" />
    <circle cx="64" cy="55" r="3.5" fill="url(#beadGrad)" />
    <circle cx="60" cy="63" r="3.6" fill="url(#beadGrad)" />
    <circle cx="52" cy="69" r="3.8" fill="url(#beadGrad)" />
    <circle cx="42" cy="72" r="4.0" fill="url(#beadGrad)" />
    <circle cx="31" cy="70" r="4.1" fill="url(#beadGrad)" />
    <circle cx="22" cy="64" r="4.3" fill="url(#beadGrad)" />

    <!-- Outer Loop -->
    <circle cx="15" cy="54" r="4.5" fill="url(#beadGrad)" />
    <circle cx="12" cy="43" r="4.6" fill="url(#beadGrad)" />
    <circle cx="14" cy="31" r="4.8" fill="url(#beadGrad)" />
    <circle cx="20" cy="21" r="5.0" fill="url(#beadGrad)" />
    <circle cx="29" cy="14" r="5.2" fill="url(#beadGrad)" />
    <circle cx="40" cy="10" r="5.4" fill="url(#beadGrad)" />
    <circle cx="52" cy="10" r="5.5" fill="url(#beadGrad)" />
    <circle cx="64" cy="13" r="5.7" fill="url(#beadGrad)" />
    <circle cx="74" cy="19" r="5.9" fill="url(#beadGrad)" />

    <!-- Transition Beads to Large Terminal Sphere -->
    <circle cx="81" cy="28" r="6.2" fill="url(#beadGrad)" />
    <circle cx="84" cy="39" r="6.6" fill="url(#beadGrad)" />
    <circle cx="84" cy="51" r="7.0" fill="url(#beadGrad)" />
    <circle cx="81" cy="62" r="7.6" fill="url(#beadGrad)" />
    <circle cx="75" cy="72" r="8.5" fill="url(#beadGrad)" filter="url(#shadow)" />

    <!-- Large Terminal Sphere -->
    <g filter="url(#shadow)">
      <circle cx="58" cy="84" r="13.5" fill="url(#largeOrbGrad)" />
      
      <!-- Internal/Surface Specular Highlights for Large Sphere -->
      <ellipse cx="53" cy="79" rx="4.5" ry="2.8" transform="rotate(-25 53 79)" fill="#ffffff" opacity="0.85" />
      <circle cx="50" cy="85" r="1.5" fill="#ffffff" opacity="0.5" />
      <path d="M 50 93 A 9 9 0 0 0 66 90" fill="none" stroke="#b2f8b2" stroke-width="1.2" opacity="0.6" />
    </g>
  </g>
</svg>
